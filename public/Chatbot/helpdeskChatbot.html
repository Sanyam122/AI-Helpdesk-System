<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpdesk AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #ffffff;
        --bg2: #f0f4f9;
        --bg3: #e4ecf5;
        --text: #0f1923;
        --text2: #4a5568;
        --border: rgba(24, 95, 165, 0.12);
        --border2: rgba(24, 95, 165, 0.25);
        --blue: #185fa5;
        --blue-dark: #0c447c;
        --blue-mid: #378add;
        --blue-light: #e6f1fb;
        --blue-xlight: #f0f6fd;
        --radius: 10px;
        --radius-lg: 16px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1520;
          --bg2: #121c2b;
          --bg3: #182336;
          --text: #e8f0f8;
          --text2: #8aa4c0;
          --border: rgba(55, 138, 221, 0.15);
          --border2: rgba(55, 138, 221, 0.3);
          --blue-light: rgba(24, 95, 165, 0.2);
          --blue-xlight: rgba(24, 95, 165, 0.1);
        }
      }

      /* ✅ FIXED: prevent full-page takeover */
      body {
        margin: 0;
        background: transparent;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* ✅ Scope font to chatbot only */
      #chat-window,
      #chat-toggle {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* ✅ Isolation (prevents CSS conflicts) */
      #chat-window {
        isolation: isolate;
      }

      #chat-toggle {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--blue);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 24px rgba(24, 95, 165, 0.45);
        z-index: 9998;
        transition:
          transform 0.2s,
          background 0.2s;
      }

      #chat-toggle:hover {
        background: var(--blue-dark);
        transform: scale(1.07);
      }

      #chat-toggle svg {
        width: 22px;
        height: 22px;
      }

      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #e24b4a;
        border: 2px solid var(--bg);
        display: none;
      }

      .badge.show {
        display: block;
      }

      #chat-window {
        position: fixed;
        bottom: 96px;
        right: 28px;
        width: 390px;
        height: 580px;
        background: var(--bg);
        border-radius: var(--radius-lg);
        border: 0.5px solid var(--border);
        box-shadow:
          0 12px 48px rgba(12, 68, 124, 0.18),
          0 2px 8px rgba(12, 68, 124, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 9999;
        transform: scale(0.92) translateY(14px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.24s cubic-bezier(0.34, 1.4, 0.64, 1),
          opacity 0.18s ease;
      }

      #chat-window.open {
        transform: scale(1) translateY(0);
        opacity: 1;
        pointer-events: all;
      }

      /* --- rest of your CSS unchanged --- */

      .chat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 0.5px solid var(--border);
        background: var(--bg2);
        flex-shrink: 0;
      }
      .avatar-orb {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .avatar-orb svg {
        width: 17px;
        height: 17px;
      }
      .header-info {
        flex: 1;
      }
      .header-info .name {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .header-info .status {
        font-size: 11px;
        color: var(--text2);
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 1px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2ecc71;
        box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.2);
      }
      .header-actions {
        display: flex;
        gap: 5px;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 0.5px solid var(--border);
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text2);
        transition: all 0.15s;
      }
      .icon-btn:hover {
        background: var(--blue-light);
        color: var(--blue);
        border-color: var(--border2);
      }
      .icon-btn svg {
        width: 13px;
        height: 13px;
      }

      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 16px 14px 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }
      .messages-area::-webkit-scrollbar {
        width: 3px;
      }
      .messages-area::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        gap: 10px;
        padding: 24px;
        text-align: center;
        color: var(--text2);
      }
      .empty-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }
      .empty-icon svg {
        width: 24px;
        height: 24px;
      }
      .empty-title {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .empty-sub {
        font-size: 12.5px;
        line-height: 1.55;
        max-width: 230px;
        color: var(--text2);
      }

      .msg-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        animation: fadeUp 0.2s ease-out;
      }
      .msg-row.user {
        flex-direction: row-reverse;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
      }
      .msg-avatar.ai-av {
        background: var(--blue);
      }
      .msg-avatar.user-av {
        background: var(--blue-light);
        color: var(--blue);
        border: 0.5px solid var(--border2);
      }
      .msg-avatar svg {
        width: 12px;
        height: 12px;
      }

      .bubble {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--text);
        word-break: break-word;
      }
      .bubble.ai {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        background: var(--blue);
        color: #fff;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 12px rgba(24, 95, 165, 0.3);
      }
      .bubble code {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        background: rgba(24, 95, 165, 0.1);
        color: var(--blue-dark);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .bubble.user code {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .bubble pre {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        background: var(--bg3);
        border: 0.5px solid var(--border);
        padding: 10px 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin-top: 7px;
        white-space: pre-wrap;
        line-height: 1.5;
        color: var(--text);
      }
      .bubble.user pre {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      .typing-row .bubble {
        padding: 12px 16px;
      }
      .typing-dots {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--blue-mid);
        opacity: 0.4;
        animation: bounce 1.2s infinite;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 14px 10px;
      }
      .chip {
        font-size: 11.5px;
        color: var(--blue);
        background: var(--blue-light);
        border: 0.5px solid var(--border2);
        border-radius: 20px;
        padding: 5px 11px;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        transition: all 0.15s;
      }
      .chip:hover {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }

      .input-area {
        padding: 10px 12px;
        border-top: 0.5px solid var(--border);
        background: var(--bg);
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .input-wrap {
        flex: 1;
        display: flex;
        align-items: flex-end;
        border: 0.5px solid var(--border2);
        border-radius: 20px;
        padding: 8px 13px;
        background: var(--bg2);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .input-wrap:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
      }
      #user-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: "Inter", sans-serif;
        font-size: 13.5px;
        color: var(--text);
        resize: none;
        max-height: 90px;
        line-height: 1.45;
      }
      #user-input::placeholder {
        color: var(--text2);
      }

      .send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--blue);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.15s;
        opacity: 0.35;
      }
      .send-btn.active {
        opacity: 1;
      }
      .send-btn:hover {
        background: var(--blue-dark);
        transform: scale(1.06);
      }
      .send-btn svg {
        width: 14px;
        height: 14px;
        margin-left: 1px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .divider span {
        font-size: 11px;
        color: var(--text2);
        white-space: nowrap;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 0.5px;
        background: var(--border);
      }

      @media (max-width: 480px) {
        #chat-window {
          right: 0;
          left: 0;
          bottom: 80px;
          width: 100%;
          border-radius: var(--radius-lg) var(--radius-lg) 0 0;
          height: 72vh;
        }
        #chat-toggle {
          bottom: 18px;
          right: 18px;
        }
      }
    </style>
  </head>
  <body>
    <button id="chat-toggle" onclick="toggleChat()" title="Chat with AI">
      <svg
        id="icon-chat"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#fff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
        />
      </svg>
      <svg
        id="icon-close"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#fff"
        stroke-width="2"
        stroke-linecap="round"
        style="display: none"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
      <span class="badge" id="badge"></span>
    </button>

    <div id="chat-window">
      <div class="chat-header">
        <div class="avatar-orb">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2z" />
            <path d="M3 20c0-4 4-7 9-7s9 3 9 7" />
          </svg>
        </div>
        <div class="header-info">
          <div class="name">AI Assistant</div>
          <div class="status">
            <span class="status-dot"></span>Online · Ready to help
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="clearChat()" title="Clear chat">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6" />
              <path d="M9 6V4h6v2" />
            </svg>
          </button>
          <button class="icon-btn" onclick="toggleChat()" title="Close">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="messages-area" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"
              />
            </svg>
          </div>
          <div class="empty-title">How can I help you today?</div>
          <div class="empty-sub">
            Ask me anything — code, writing, analysis, or creative ideas.
          </div>
        </div>
      </div>

      <div class="suggestions" id="suggestions">
        <button class="chip" onclick="useChip(this)">Write Python code</button>
        <button class="chip" onclick="useChip(this)">Explain a concept</button>
        <button class="chip" onclick="useChip(this)">Review my idea</button>
        <button class="chip" onclick="useChip(this)">Help me debug</button>
      </div>

      <div class="input-area">
        <div class="input-wrap">
          <textarea
            id="user-input"
            placeholder="Message AI Assistant…"
            rows="1"
            onkeydown="handleKey(event)"
            oninput="handleInput(this)"
          ></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      const API_KEY = "p";
      const MODEL = "openrouter/free";
      const API_URL = "https://openrouter.ai/api/v1/chat/completions";
      const SYSTEM_PROMPT = `You are a helpful, friendly, and knowledgeable AI assistant embedded on a website.
      Be concise, clear, and conversational. Use markdown code blocks for code snippets.
      Use dashes for bullet lists. Avoid being verbose unless the user specifically asks for detail.`;

      let history = [],
        isThinking = false,
        isOpen = false;

      const win = document.getElementById("chat-window");
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const emptyState = document.getElementById("empty-state");
      const suggestionsEl = document.getElementById("suggestions");
      const badge = document.getElementById("badge");

      function toggleChat() {
        isOpen = !isOpen;
        win.classList.toggle("open", isOpen);
        document.getElementById("icon-chat").style.display = isOpen
          ? "none"
          : "block";
        document.getElementById("icon-close").style.display = isOpen
          ? "block"
          : "none";
        if (isOpen) {
          badge.classList.remove("show");
          inputEl.focus();
        }
      }

      function handleInput(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 90) + "px";
        sendBtn.classList.toggle("active", el.value.trim().length > 0);
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function useChip(btn) {
        inputEl.value = btn.textContent;
        handleInput(inputEl);
        sendMessage();
      }

      function clearChat() {
        history = [];
        messagesEl.innerHTML = "";
        messagesEl.appendChild(emptyState);
        emptyState.style.display = "flex";
        suggestionsEl.style.display = "flex";
      }

      function escapeHtml(t) {
        return t
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatContent(text) {
        const blocks = [];
        let result = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => {
          blocks.push(`<pre>${escapeHtml(c.trim())}</pre>`);
          return `%%B${blocks.length - 1}%%`;
        });
        result = result.replace(
          /`([^`]+)`/g,
          (_, c) => `<code>${escapeHtml(c)}</code>`,
        );
        result = result.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        result = result.replace(/\*(.*?)\*/g, "<em>$1</em>");
        result = result.replace(/\n/g, "<br>");
        blocks.forEach((b, i) => (result = result.replace(`%%B${i}%%`, b)));
        return result;
      }

      function addMessage(role, content) {
        if (emptyState.parentNode) emptyState.remove();
        suggestionsEl.style.display = "none";

        const row = document.createElement("div");
        row.className = `msg-row ${role}`;

        const av = document.createElement("div");
        av.className = `msg-avatar ${role === "assistant" ? "ai-av" : "user-av"}`;
        av.innerHTML =
          role === "assistant"
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

        const bubble = document.createElement("div");
        bubble.className = `bubble ${role === "assistant" ? "ai" : "user"}`;
        bubble.innerHTML = formatContent(content);

        row.appendChild(av);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addTyping() {
        if (emptyState.parentNode) emptyState.remove();
        const row = document.createElement("div");
        row.className = "msg-row assistant typing-row";
        row.id = "typing";
        const av = document.createElement("div");
        av.className = "msg-avatar ai-av";
        av.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3"/></svg>`;
        const bubble = document.createElement("div");
        bubble.className = "bubble ai";
        bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
        row.appendChild(av);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function sendMessage() {
        if (isThinking) return;
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = "";
        inputEl.style.height = "auto";
        sendBtn.classList.remove("active");
        isThinking = true;

        addMessage("user", text);
        history.push({ role: "user", content: text });
        addTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: MODEL,
              max_tokens: 1024,
              messages: [
                { role: "system", content: SYSTEM_PROMPT },
                ...history,
              ],
            }),
          });

          const data = await res.json();
          document.getElementById("typing")?.remove();

          if (data.choices?.[0]?.message?.content) {
            const reply = data.choices[0].message.content;
            history.push({ role: "assistant", content: reply });
            addMessage("assistant", reply);
            if (!isOpen) badge.classList.add("show");
          } else {
            addMessage("assistant", "Something went wrong.");
          }
        } catch (err) {
          document.getElementById("typing")?.remove();
          addMessage("assistant", "Network error. Try again.");
        }

        isThinking = false;
      }
    </script>
  </body>
</html>
